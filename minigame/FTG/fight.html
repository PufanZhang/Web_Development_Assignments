<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>光辉编年史 - 格斗挑战</title>

    <link rel="stylesheet" href="./fight.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<div id="game-container">
    <div id="fight-view">
        <div id="fight-ui">
            <div class="health-bar">
                <div class="health-label">玩家</div>
                <div class="health-container">
                    <div id="player-health" class="health-fill"></div>
                </div>
                <div id="player-buff-timer" class="buff-timer"></div>
            </div>

            <div class="health-bar enemy-health">
                <div class="health-label">敌人</div>
                <div class="health-container">
                    <div id="enemy-health" class="health-fill"></div>
                </div>
            </div>
        </div>

        <div id="arena">
            <div id="player-fighter" class="fighter"></div>
            <div id="enemy-fighter" class="fighter enemy"></div>
        </div>

        <div id="fight-result"></div>

        <div id="fight-controls-hint">
            <p>控制: A/D-移动, W-跳跃, J-攻击, K-格挡, Q-大招</p>
            <p>大招：立刻回复血量，攻击力翻倍，格挡可以减免全部伤害</p>
        </div>
    </div>
</div>

<script type="module" src="./fight.js"></script>
</body>
</html>
