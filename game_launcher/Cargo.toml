[package]
name = "game_launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
opener = "0.8"
tokio = { version = "1.47.1", features = ["fs", "io-std"] }
sha2 = "0.10"
jsonwebtoken = "9.2.0"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.5.0"