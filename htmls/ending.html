<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>火山行动 · 终局</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            color: white;
            background: url('/assets/login/background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .credits-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            background: rgba(0, 0, 0, 0.5); /* 半透明遮罩，文字更清晰 */
        }

        .credits {
            text-align: center;
            animation: scroll-up 20s linear forwards;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 50px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            margin: 40px 0;
        }

        .stats {
            font-size: 18px;
            color: #FFD700;
        }

        .thanks {
            font-size: 26px;
            margin-top: 80px;
            animation: blink 1.5s infinite;
        }

        .return-hint {
            position: fixed;
            bottom: 30px;
            right: 40px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes scroll-up {
            0% {
                transform: translateY(100%);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.4; }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="credits-container">
    <div class="credits">
        <h1>火山行动 · 终局</h1>

        <p class="stats"></p>

        <p class="thanks">—— 感谢你的游玩 ——</p>
    </div>
</div>

<div class="return-hint">
    按任意键返回主菜单
</div>

<script type="module" src="/js/game/ending.js"></script>

</body>
</html>
