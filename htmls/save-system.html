<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存档系统 - 量子数据库</title>
    <link rel="stylesheet" href="/css/save-system.css">
</head>
<body>
<div class="confirm-modal" id="restrictionModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>功能锁定</h3>
        </div>
        <div class="modal-body">
            <p>亲爱的时间旅行者，为了让您能完整地体验游戏，需要先抵达任意一个结局，才能解锁自由读档的功能哦！快去创造属于你的结局吧！</p>
        </div>
        <div class="modal-actions">
            <button class="modal-btn confirm-btn-green" onclick="goBack()">返回主界面</button>
        </div>
    </div>
</div>

<div class="save-container" id="saveContainer">
    <div class="tech-background"></div>

    <header class="save-header">
        <button class="back-btn" onclick="goBack()">
            <span class="btn-icon">◄</span>
            <span class="btn-text">返回主界面</span>
        </button>
        <div class="title">
            <span class="title-main">存档系统</span>
            <span class="title-sub">QUANTUM DATABASE</span>
        </div>
        <div class="system-status">
            <span class="status-dot"></span>
            <span class="status-text">系统在线</span>
        </div>
    </header>

    <main class="save-main">
        <div class="save-grid" id="saveGrid">
        </div>

        <div class="no-saves-message" id="noSavesMessage" style="display: none;">
            <div class="no-saves-icon">📁</div>
            <h3>无存档记录</h3>
            <p>在游戏中手动存档后，会在这里显示哦</p>
        </div>
    </main>
</div>

<div class="save-detail" id="saveDetail" style="display: none;">
    <div class="detail-background">
        <button class="close-btn detail-back-btn" onclick="closeSaveDetail()">×</button>
        <div class="neural-network"></div>

        <div class="detail-content">

            <div class="save-info-card">
                <div class="save-avatar" id="avatarText">
                    存档 00
                    <div class="avatar-glow"></div>
                </div>
                <div class="save-metadata">
                    <div class="save-name" id="saveName">存档名称</div>
                    <div class="save-stats">
                        <div class="stat-item">
                            <span class="stat-label">上次保存</span>
                            <span class="stat-value" id="lastSave">时间戳</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">当前地点</span>
                            <span class="stat-value" id="currentLevel">地点</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="description-section">
                <div class="section-title">
                    <span class="title-icon">❞</span>
                    <span>数据摘要</span>
                </div>
                <p class="save-description" id="saveDescription">这里是存档的描述信息...</p>
            </div>

            <div class="progress-section">
                <div class="section-title">
                    <span class="title-icon">📈</span>
                    <span>任务进度</span>
                </div>
                <div class="progress-grid">
                    <div class="progress-item">
                        <div class="progress-header">
                            <span class="progress-label">主线进度</span>
                            <span class="progress-percent" id="mainProgress">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill main-progress" id="mainProgressBar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn load-btn" onclick="loadSave()">
                    <span class="btn-icon">▶</span>
                    <span>加载存档</span>
                </button>
            </div>

        </div>
    </div>
</div>

<div class="confirm-modal" id="loadConfirmModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>加载成功</h3>
        </div>
        <div class="modal-body">
            <p>存档已成功加载，要立即进入游戏吗？</p>
        </div>
        <div class="modal-actions">
            <button class="modal-btn cancel-btn" onclick="closeLoadConfirmModal()">留在此处</button>
            <button class="modal-btn confirm-btn-green" onclick="enterGame()">进入游戏</button>
        </div>
    </div>
</div>

<script type="module" src="/js/save-system.js"></script>
</body>
</html>
