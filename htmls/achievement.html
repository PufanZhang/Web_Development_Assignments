<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就系统 - 科幻版</title>
    <link rel="stylesheet" href="/css/achievement_styles.css">
</head>
<body>
<div class="achievement-container">
    <header class="achievement-header">
        <button class="back-btn" onclick="goBack()">返回</button>
        <div class="title">成就系统</div>
    </header>

    <!-- 成就分类列表 -->
    <main class="achievement-main">
        <div class="achievement-categories">
            <!-- 回忆碎片收集 -->
            <div class="category-card" onclick="openCategory('memory')">
                <div class="category-icon">🧬</div>
                <div class="category-info">
                    <h3>记忆碎片</h3>
                    <p class="progress">已收集: <span id="memory-progress">0</span>/6</p>
                    <div class="progress-bar">
                        <div class="progress-fill memory-progress" style="width: 0"></div>
                    </div>
                </div>
                <div class="category-arrow">›</div>
            </div>

            <!-- 解密成就 -->
            <div class="category-card" onclick="openCategory('decrypt')">
                <div class="category-icon">🔐</div>
                <div class="category-info">
                    <h3>解密大师</h3>
                    <p class="progress">已完成: <span id="decrypt-progress">0</span>/3</p>
                    <div class="progress-bar">
                        <div class="progress-fill decrypt-progress" style="width: 0"></div>
                    </div>
                </div>
                <div class="category-arrow">›</div>
            </div>

            <!-- 解锁新人物 -->
            <div class="category-card" onclick="openCategory('character')">
                <div class="category-icon">🤖</div>
                <div class="category-info">
                    <h3>角色收集</h3>
                    <p class="progress">已解锁: <span id="character-progress">0</span>/4</p>
                    <div class="progress-bar">
                        <div class="progress-fill character-progress" style="width: 0"></div>
                    </div>
                </div>
                <div class="category-arrow">›</div>
            </div>

            <!-- 任务完成 -->
            <div class="category-card" onclick="openCategory('mission')">
                <div class="category-icon">⚡</div>
                <div class="category-info">
                    <h3>任务完成</h3>
                    <p class="progress">已完成: <span id="mission-progress">0</span>/3</p>
                    <div class="progress-bar">
                        <div class="progress-fill mission-progress" style="width: 0"></div>
                    </div>
                </div>
                <div class="category-arrow">›</div>
            </div>
        </div>
    </main>
</div>

<!-- 具体成就详情弹窗 -->
<div class="achievement-modal" id="achievementModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">成就详情</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="achievement-grid" id="achievementGrid">
                <!-- 动态生成成就项 -->
            </div>
        </div>
    </div>
</div>

<!-- 单个成就详情页面 -->
<div class="achievement-detail" id="achievementDetail">
    <div class="detail-content">
        <div class="detail-background" id="detailBackground">
            <button class="detail-back-btn" onclick="closeDetail()">←</button>
            <div class="detail-info">
                <div class="achievement-badge" id="achievementIcon">🏆</div>
                <h2 id="achievementName">成就名称</h2>
                <p id="achievementDescription">成就描述文字...</p>
                <div class="achievement-status" id="achievementStatus">
                    <span class="status-text">未完成</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/achievement.js"></script>
</body>
</html>
