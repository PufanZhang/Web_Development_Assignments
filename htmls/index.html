<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时空回响</title>
    <link rel="stylesheet" href="/css/mainMenu.css">
</head>

<div id="tutorial-confirm-overlay" class="modal-overlay">
    <div class="modal-content">
        <h2 class="modal-title">初次见面！</h2>
        <p class="modal-text">看起来你是第一次来到《时空回响》的世界呢！需要我为你做一个简单的介绍吗？</p>
        <div class="modal-buttons">
            <button id="confirm-tutorial-no" class="menu-btn about-btn">跳过</button>
            <button id="confirm-tutorial-yes" class="menu-btn achievement-btn">介绍</button>
        </div>
    </div>
</div>

<div id="tutorial-main-overlay" class="modal-overlay">
    <div class="modal-content tutorial-modal">
        <div class="tutorial-header">
            <h2 class="modal-title">新手引导</h2>
            <button id="tutorial-close" class="close-btn">&times;</button>
        </div>
        <div class="tutorial-body">
            <div class="tutorial-image-container">
                <img id="tutorial-image" src="" alt="教程图片" class="tutorial-image">
            </div>
            <p id="tutorial-description" class="modal-text"></p>
        </div>
        <div class="tutorial-footer">
            <button id="tutorial-prev" class="menu-btn save-btn">上一页</button>
            <span id="tutorial-progress">1 / 4</span>
            <button id="tutorial-next" class="menu-btn start-btn">下一页</button>
        </div>
    </div>
</div>

<body>
<div class="particles" id="particles"></div>

<div id="user-info-panel" class="user-info-panel">
    <div class="panel-content">
        <h3 class="username">
            <span class="username-label">用户名</span>
            <span id="username-display">一位旅行者</span>
        </h3>

        <div class="info-section">
            <p class="section-title">旅途计时</p>
            <div id="playtime-container" class="playtime-container">
                <span class="digit-group" id="playtime-h">00</span>
                <span class="separator">:</span>
                <span class="digit-group" id="playtime-m">00</span>
                <span class="separator">:</span>
                <span class="digit-group" id="playtime-s">00</span>
            </div>
        </div>

        <div class="info-section">
            <p class="section-title">成就进度 (<span id="total-ach-progress">0/16</span>)</p>
            <ul id="achievement-list" class="achievement-list">
                <li>
                    <div class="ach-info">
                        <span>记忆大师</span>
                        <span id="memory-progress">0/6</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="memory-bar" class="progress-bar-fg" style="width: 0;"></div>
                    </div>
                </li>
                <li>
                    <div class="ach-info">
                        <span>解密大师</span>
                        <span id="decrypt-progress">0/3</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="decrypt-bar" class="progress-bar-fg" style="width: 0;"></div>
                    </div>
                </li>
                <li>
                    <div class="ach-info">
                        <span>角色收集</span>
                        <span id="character-progress">0/4</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="character-bar" class="progress-bar-fg" style="width: 0;"></div>
                    </div>
                </li>
                <li>
                    <div class="ach-info">
                        <span>任务完成</span>
                        <span id="mission-progress">0/3</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="mission-bar" class="progress-bar-fg" style="width: 0;"></div>
                    </div>
                </li>
            </ul>
            <div class="panel-footer">
                <button id="panel-logout-btn" class="menu-btn logout-btn">退出登录</button>
            </div>
            <button id="show-delete-account-modal-btn" class="bottom-btn delete-account-link">注销账号</button>
        </div>
    </div>
    <div class="panel-handle"></div>
</div>

<div class="main-container">
    <div class="logo-section">
        <h1 class="game-title">时空回响</h1>
        <p class="game-subtitle">重遇平行时空的TA</p >
    </div>

    <div class="menu-buttons">
        <button class="menu-btn start-btn">开始游戏</button>
        <button class="menu-btn save-btn">读取存档</button>
        <button class="menu-btn achievement-btn">查看成就</button>
        <button class="menu-btn about-btn">关于我们</button>
    </div>
</div>

<div class="bottom-right-container">
    <button class="bottom-btn" id="show-tutorial-btn">查看教程</button>
    <div class="version-info">
        Version 1.1.0
    </div>
</div>

<div id="delete-account-overlay" class="modal-overlay">
    <div class="modal-content">
        <h2 class="modal-title warning-title">！！！警告！！！</h2>
        <p class="modal-text">你确定要注销你的账号吗？<br>
            这是一个<strong style="color: #ff6b6b;">不可撤销</strong>的操作！所有存档、成就和角色数据都将被永久删除！
        </p>
        <div class="modal-buttons">
            <button id="cancel-delete-btn" class="menu-btn save-btn">我再想想</button>
            <button id="confirm-delete-btn" class="menu-btn logout-btn" disabled>确认注销 (3)</button>
        </div>
    </div>
</div>

<script type="module" src="/js/main_menu.js"></script>
</body>
</html>
