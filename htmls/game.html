<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>光辉编年史</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="game-container">
    <button id="return-to-menu" style="position: absolute; top: 10px; left: 10px; z-index: 1000; padding: 8px 12px;">返回主页</button>
    <div id="map-view">
        <div id="player"></div>
        <div id="interaction-prompt" class="interaction-prompt">E</div>
    </div>

    <div id="dialogue-view">
        <div id="character-container"></div>
        <div id="dialogue-box">
            <p id="character-name"></p>
            <p id="dialogue-text"></p>
            <div id="dialogue-options-container"></div>
        </div>
    </div>

    <div id="debug-view"></div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
